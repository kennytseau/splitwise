      :d.delta>0?'<span class="lbl">you lent</span><span class="amt pos num">'+esc(fmt(d.delta,g.currency))+'</span>'
      :d.delta<0?'<span class="lbl">you owe</span><span class="amt neg num">'+esc(fmt(-d.delta,g.currency))+'</span>'
      :'<span class="lbl">your share</span><span class="amt zero num">'+esc(fmt(d.owed,g.currency))+'</span>';
    rows+='<button class="row" data-act="openexp" data-id="'+esc(e.id)+'">'
      +'<span class="rdate"><span class="d num">'+dp.d+'</span><span class="m">'+MON[dp.m]+'</span></span>'
      +icon(e.category)
      +'<span class="rmain"><span class="rtitle">'+esc(e.desc)+'</span>'
      +'<span class="rmeta">'+esc(payer)+' · '+esc(cat(e.category).label)
      +(e.series?" · repeats":"")
      +(e.note?" · "+esc(e.note):"")+'</span></span>'
      +'<span class="rside">'+side+'</span></button>';
  }
  flush();
  if(ex.length>limit)
    h+='<button class="btn block" data-act="showmore">Show earlier expenses — '
      +(ex.length-limit)+' older still hidden</button>';
  return h;
}
var PIE_C=276.46;   /* 2 pi r, with r = 44 in the circle's 120-unit box */
/* What the circle can actually draw. A category in credit -- a refund -- gets
   no slice, since a negative share of a whole is not a thing you can draw. It
   stays in the rows underneath, and the note below the circle accounts for it. */
function pieOf(b,gid){
  var all=catsFor(gid),rows=[],i,v;
  for(i=0;i<all.length;i++){
    v=b.cats[all[i].id];
    if(v>0)rows.push({c:all[i],v:v});
  }
  rows.sort(function(a,z){return z.v-a.v;});
  var top=rows.slice(0,6),rest=rows.slice(6),other=0,sum=0,col={};
  for(i=0;i<rest.length;i++){other+=rest[i].v;col[rest[i].c.id]="var(--neutral)";}
  for(i=0;i<top.length;i++){col[top[i].c.id]="var(--s"+(i+1)+")";sum+=top[i].v;}
  return {top:top,other:other,rest:rest.length,sum:sum+other,col:col};
}
/* One ring, one circle element per slice: a dash as long as that slice's share
   of the circumference, pushed around the ring by everything drawn before it.
   Taking two units off each dash leaves the gap that stops two neighbouring
   colours reading as one block. */
function pieSvg(p,cur,label){
  var parts=p.top.slice(),i,cum=0,names=[],h;
  if(p.other>0)
    parts.push({c:{id:"other",label:"Other"+(p.rest>1?" ("+p.rest+" categories)":"")},v:p.other});
  for(i=0;i<parts.length;i++)
    names.push(parts[i].c.label+" "+Math.round(parts[i].v/p.sum*100)+"%");
  h='<div class="pie"><svg viewBox="0 0 120 120" role="img" aria-label="'
    +esc(label+": "+(names.length?names.join(", "):"nothing to show yet"))+'">'
    +'<circle class="track" cx="60" cy="60" r="44"></circle>';
  for(i=0;i<parts.length;i++){
    var frac=parts[i].v/p.sum,draw=Math.max(.6,frac*PIE_C-(parts.length>1?2:0));
    h+='<circle cx="60" cy="60" r="44" transform="rotate(-90 60 60)" style="stroke:'
      +(i<p.top.length?"var(--s"+(i+1)+")":"var(--neutral)")+'" stroke-dasharray="'
      +draw.toFixed(2)+' '+(PIE_C-draw).toFixed(2)+'" stroke-dashoffset="'
      +(-cum*PIE_C).toFixed(2)+'"><title>'
      +esc(parts[i].c.label+" — "+fmt(parts[i].v,cur)+", "+Math.round(frac*100)+"%")
      +'</title></circle>';
    cum+=frac;
  }
  return h+'</svg><div class="piemid"><span class="pv num">'+esc(fmt(p.sum,cur))
    +'</span><span class="pk">'+esc(label)+'</span></div></div>';
}
function spanBtn(id,label,cur){
  return '<button data-act="span" data-v="'+id+'" aria-pressed="'+(cur===id)+'">'+label+'</button>';
}
function shortPeriod(k){
  return k.length>4?MON[(+k.split("-")[1])-1]:"’"+k.slice(2);
}
/* A strip of bars, one per period, that picks the period the rest of the tab
   is about. Months and years differ only in their labels and what a tap sets. */
function periodBars(ex,rules,g,list,chosen,act,attr,labelOf){
  var tot=[],peak=1,i,h='<div class="bars">';
  for(i=0;i<list.length;i++){
    tot.push(spanBreakdown(ex,rules,g.id,list[i]).total);
    if(tot[i]>peak)peak=tot[i];
  }
  for(i=0;i<list.length;i++)
    h+='<button class="bar'+(list[i]===chosen?" on":"")+'" data-act="'+act+'" '+attr+'="'+list[i]
      +'" title="'+esc(labelOf(list[i])+" — "+fmt(tot[i],g.currency))+'">'
      +'<span class="col" style="height:'+Math.max(2,Math.round(tot[i]/peak*100))+'%"></span>'
      +'<span class="lab">'+esc(shortPeriod(list[i]))+'</span></button>';
  return h+'</div>';
}
function renderSpending(g,ex){
  var rules=rulesOf(g.id),months=monthsOf(ex),i;
  if(!months.length)
    return '<div class="card"><div class="empty"><h3>Nothing to break down yet</h3>'
      +'<p>Once there are expenses, this shows where the money went, month by month.</p></div></div>';
  var years=yearsOf(months);
  var span=(S.span==="year"||S.span==="all")?S.span:"month";
  var month=(S.month&&months.indexOf(S.month)>=0)?S.month:months[0];
  var year=(S.year&&years.indexOf(S.year)>=0)?S.year:years[0];
  var prefix=span==="all"?"":(span==="year"?year:month);
  var title=span==="all"?"All time":(span==="year"?year:monthLabel(month));
  var b=spanBreakdown(ex,rules,g.id,prefix);

  /* how much time the tab has to work with, and the strip that chooses it */
  var kept=span==="year"?years.length+(years.length===1?" year":" years")
    :(span==="month"&&months.length>12?"last 12 months"
      :months.length+(months.length===1?" month":" months"));
  var h='<div class="card" style="margin-bottom:14px"><div class="mhead"><span>Spending</span>'
    +'<span class="mt">'+esc(kept)+'</span></div>'
    +'<div class="spanpick"><div class="seg">'+spanBtn("month","Month",span)
    +spanBtn("year","Year",span)+spanBtn("all","All time",span)+'</div></div>';
  if(span==="month")
    h+=periodBars(ex,rules,g,months.slice(0,12).reverse(),month,"pickmonth","data-m",monthLabel);
  else if(span==="year")
    h+=periodBars(ex,rules,g,years.slice(0,12).reverse(),year,"pickyear","data-y",function(y){return y;});
  h+='</div>';

  /* the chosen period */
  h+='<div class="card"><div class="mhead"><span>'+esc(title)+'</span>'
    +'<span class="mt num">'+esc(fmt(b.total,g.currency))+' · '+b.count
    +(b.count===1?" expense":" expenses")+'</span></div>';

  var p=pieOf(b,g.id);
  h+=pieSvg(p,g.currency,title);
  /* Whatever came back as credit over the period is not in the circle, so say
     so rather than let the figure in the middle quietly disagree with the one
     in the header. */
  var back=p.sum-b.total;
  if(back>0)
    h+='<p class="pienote">'+esc(fmt(back,g.currency))
      +' came back in refunds, so it is not in the circle.</p>';

  var named=b.buckets.needs+b.buckets.wants+b.buckets.savings;
  /* 50/30/20 only means anything where savings are actually recorded. In a
     ledger that tracks spending alone, a Savings tile pinned at 0% against a
     20% target reports a failure that is not happening, so it only appears
     once there is something in it -- and the targets come with it. */
  var trio=[["needs","Needs","50"],["wants","Wants","30"]];
  if(b.buckets.savings)trio.push(["savings","Savings","20"]);
  var targets=trio.length===3;
  h+='<div class="stats">';
  for(i=0;i<trio.length;i++){
    var v=b.buckets[trio[i][0]];
    h+='<div class="stat"><div class="k">'+trio[i][1]+'</div><div class="v num">'
      +(named?Math.round(v/named*100)+"%":"—")+'</div>'
      +'<div class="s num">'+esc(fmt(v,g.currency))
      +(targets?' · target '+trio[i][2]+'%':' · of tracked spending')+'</div></div>';
  }
  h+='</div>';

  var rows=[],all=catsFor(g.id);
  for(i=0;i<all.length;i++)if(b.cats[all[i].id])rows.push({c:all[i],v:b.cats[all[i].id]});
  rows.sort(function(a,z){return z.v-a.v;});
  var max=rows.length?rows[0].v:1;
  for(i=0;i<rows.length;i++){
    var r=rows[i];
    var cls=r.v<0?" cr":(r.c.id==="unclassified"?" un":"");
    /* The swatch is what makes these rows the circle's key, so no slice is
       told apart by its colour alone. A row the circle left out -- a refund --
       gets an empty swatch rather than a colour pointing at a slice that is
       not there. */
    var sw=p.col[r.c.id];
    h+='<div class="catrow"><span class="cname"><i class="sw'
      +(sw?'" style="background:'+sw+'"':' off"')+'></i>'+esc(r.c.label)+'</span>'
      +'<span class="track2"><span class="fill2'+cls+'" style="width:'
      +Math.max(2,Math.round(Math.abs(r.v)/(max||1)*100))+'%"></span></span>'
      +'<span class="camt num'+(r.v<0?" pos":"")+'">'+esc(fmt(r.v,g.currency))+'</span>'
      +'<span class="cpct num">'+(b.total?Math.round(r.v/b.total*100):0)+'%</span></div>';
  }

  var un=b.cats.unclassified||0;
  /* "of All time" does not read as English, so the whole ledger says so. */
  if(un)
    h+='<div class="sug"><span class="txt">'+esc(fmt(un,g.currency))+' of '
      +esc(span==="all"?"everything logged so far":title)
      +' has no category yet, so it is left out of the needs and wants split above. '
      +'Nothing is guessed from a merchant’s name.</span>'
      +'<button class="btn" data-act="classify">Classify merchants</button></div>';
  return h+'</div>';
}

/* Coalesce repaints. setTimeout rather than requestAnimationFrame: rAF is
   throttled to a standstill in background or non-compositing tabs, which would
   strand the page on its loading state until it was focused. */
var renderQ=false;
function render(){

/* Which sheet is on screen, so a repaint can tell a redraw of the same sheet
   from a different one opening. */
var sheetShown=null;
function renderSheet(){
  var root=document.getElementById("sheetroot");
  if(!S.sheet){
    root.innerHTML="";sheetShown=null;
    document.body.classList.remove("sheeton");
    return;
  }
  document.body.classList.add("sheeton");
  var k=S.sheet.kind,h="";
  if(k==="expense")h=sheetExpense();
  else if(k==="group")h=sheetGroup();
  else if(k==="settle")h=sheetSettle();
  else if(k==="members")h=sheetMembers();
  else if(k==="gmenu")h=sheetGmenu();
  else if(k==="series")h=sheetSeries();
  else if(k==="import")h=sheetImport();
  else if(k==="whoami")h=sheetWhoAmI();
  else if(k==="classify")h=sheetClassify();
  else if(k==="share")h=sheetShare();
  /* The sheet is rebuilt wholesale, which would otherwise throw the reader back
     to the top every time they tap a row. Carry the scroll position across a
     redraw of the same sheet; a different sheet still opens at the top. */
  var was=root.querySelector(".sheet"),top=was?was.scrollTop:0;
  var tag=k+"/"+(S.sheet.id||"")+"/"+(S.sheet.step||"");
  root.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+h+'</div></div>';
  if(top&&tag===sheetShown){
    var now=root.querySelector(".sheet");
    if(now)now.scrollTop=top;
  }
  sheetShown=tag;
}

function involved(gid,mid){
  var ex=expensesOf(gid),st=settlementsOf(gid),i,j;
  for(i=0;i<ex.length;i++){
    for(j=0;j<ex[i].payers.length;j++)if(ex[i].payers[j].m===mid)return true;
    for(j=0;j<ex[i].shares.length;j++)if(ex[i].shares[j].m===mid)return true;

  for(i=0;i<st.length;i++)if(st[i].from===mid||st[i].to===mid)return true;
  return false;

/* Working down a thousand names one dropdown at a time is nobody's evening.
   Takes "name, category" per line, and also the exported rows as they are,
   so a list can be filled in elsewhere and applied in one go. */
function exportUnclassified(){
  var g=S.groups[S.sheet?S.sheet.gid:S.gid];
  if(!g)return;
  /* Everything, with whatever category it already has, so the file is a
     round trip: export, edit anywhere, paste back. */
  var list=allMerchants(expensesOf(g.id),rulesOf(g.id)),d=cinfo(g.currency).d,i;
  var lines=["Name,Expenses,Total,Category"];
  for(i=0;i<list.length;i++)
    lines.push([list[i].label,list[i].n,(list[i].cents/100).toFixed(d),
      list[i].cat==="unclassified"?"":catInfo(g.id,list[i].cat).label].map(csvCell).join(","));
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=(g.name.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"-").toLowerCase()||"group")+"-unclassified.csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  toast("Downloaded "+list.length+" names. Fill in the Category column, then paste the rows back.");
}
function applyBulkRules(gid,text){
  var lines=String(text).split(/\r\n|\n|\r/),cats=catsFor(gid),byLabel={},i;
  for(i=0;i<cats.length;i++)byLabel[cats[i].label.toLowerCase()]=cats[i].id;
  var cur=S.rules[gid],body=cur?JSON.parse(JSON.stringify(cur)):{};
  if(!body.map)body.map={};
  var ok=0,bad=0;
  for(i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    var f=splitCsvLine(line);
    if(f.length<2){bad++;continue;}
    var name=normDesc(f[0]);
    /* "Fees, tax & professional" has a comma in it, so try the whole tail as
       the category first; an exported row falls back to its last column. */
    var tail=f.slice(1).join(",").trim().toLowerCase();
    var id=byLabel[tail]||byLabel[String(f[f.length-1]).trim().toLowerCase()];
    if(!name||!id){bad++;continue;}
    body.map[name]=id;ok++;
  }
  body.id=gid;body.gid=gid;body.updatedAt=Date.now();
  if(ok)put("rules",gid,body);
  toast(ok+" applied"+(bad?", "+bad+" line"+(bad===1?"":"s")+" not understood":"")+".");
}

  if(p.currency&&p.currency!==g.currency)
    h+='<p class="note warn" style="margin-top:6px">The file is in '+esc(p.currency)+' but this group is in '
      +esc(g.currency)+'. Amounts come across as they are, with no conversion.</p>';
  h+='</div><div class="field"><span class="flabel">Who is who</span>';
  for(i=0;i<p.people.length;i++){
    h+='<div class="maprow"><span>'+esc(p.people[i])+'</span><select class="inp" data-map="'+i+'">';
    for(j=0;j<g.members.length;j++)
      h+='<option value="'+esc(g.members[j].id)+'"'+(g.members[j].id===F.map[i]?" selected":"")+'>'
        +esc(g.members[j].name)+'</option>';
    h+='</select></div>';
  }
  h+='</div><p class="note">Importing the same file again replaces these entries rather than '
    +'duplicating them. Existing expenses are left alone.</p>';
  return h+'</div><div class="sfoot"><button class="btn" data-act="close">Cancel</button>'
    +'<button class="btn primary" data-act="runimport">Import '+(p.expenses+p.payments)+' entries</button></div>';
}
function sheetShare(){
  var h=shead("Sharing")+'<div class="sbody">';
  if(!S.space){
    h+='<p style="margin-top:0">Right now this ledger lives only in this browser. '
      +'Create a shared space and everything here moves to your own server, '
      +'so anyone you send the link to sees the same figures and can add expenses too.</p>'
      +'<div class="field"><button class="btn primary block" data-act="createspace">Create a shared space</button></div>'
      +'<p class="note">Expenses are encrypted on this device before they are sent, with a key that '
      +'lives only in the share link. The server stores unreadable ciphertext. '
      +'That also means the link cannot be recovered or reset — lose it and the ledger is gone, '
      +'so keep a copy somewhere safe.</p>';
  }else{
    h+='<div class="field"><span class="flabel">Share link</span>'
      +'<div class="linkbox"><input class="inp" id="sharelink" readonly value="'+esc(shareLink())+'">'
      +'<button class="btn" data-act="copylink">Copy</button></div></div>'
      +'<p class="note">Send this to the people you split with. Opening it on any device joins this '
      +'space — no account needed. The link is also the decryption key: without it nobody can read '
      +'this ledger, and with it they can read and change everything. There is no way to reset it, '
      +'so keep a copy somewhere safe and send it somewhere private.</p>'
      +'<div class="field"><span class="flabel">Status</span><p style="margin:0">'
      +(S.status==="off"?"Offline. Changes are saved on this device and will sync when the connection returns."
        :S.lastSync?"Synced "+esc(ago(S.lastSync))+".":"Syncing…")+'</p></div>'
      +'<div class="field"><button class="btn block" data-act="syncnow">Sync now</button></div>'
      +'<div class="field"><button class="btn danger block" data-act="leavespace">'
      +(S.confirm==="leave"?"Tap again to stop syncing":"Stop syncing on this device")+'</button>'
      +'<p class="note" style="margin-top:6px">The shared copy stays as it is; this device just stops '
      +'following it and goes back to its own local ledger.</p></div>';
  }
  return h+'</div><div class="sfoot"><button class="btn" data-act="close">Close</button></div>';
}

function openExpense(id){
  var g=S.groups[S.gid];
  if(!g)return;
  var me=meOf(g.id),i;
  if(id&&S.expenses[id]){
    var e=S.expenses[id],raw={},payRaw={},sel=[],order=[];
    for(i=0;i<e.shares.length;i++)sel.push(e.shares[i].m);
    if(e.rawSplit)raw=JSON.parse(JSON.stringify(e.rawSplit));
    else for(i=0;i<e.shares.length;i++)raw[e.shares[i].m]=(e.shares[i].cents/100).toFixed(2);
    for(i=0;i<e.payers.length;i++){
      order.push(e.payers[i].m);
      payRaw[e.payers[i].m]=(e.payers[i].cents/100).toFixed(cinfo(g.currency).d);
    }
    S.sheet={kind:"expense",gid:g.id,id:e.id,desc:e.desc,
      amount:(e.cents/100).toFixed(cinfo(g.currency).d),date:e.date,category:e.category,
      note:e.note||"",mode:e.mode||"equal",sel:sel,raw:raw,rule:null,step:null,cust:null,
      multiPay:e.payers.length>1,payer:e.payers[0]?e.payers[0].m:me,payerOrder:order,payRaw:payRaw};
  }else{
    var all=g.members.map(function(m){return m.id;});
    S.sheet={kind:"expense",gid:g.id,id:null,desc:"",amount:"",date:today(),category:"food",
      note:"",mode:"equal",sel:all,raw:{},rule:null,step:null,cust:null,multiPay:false,payer:me||all[0],
      payerOrder:all.slice(),payRaw:{}};
  }
  S.confirm=null;render();
}
function openGroup(id){
  if(id&&S.groups[id]){
    var g=S.groups[id];
    S.sheet={kind:"group",id:g.id,name:g.name,currency:g.currency,
      names:g.members.map(function(m){return m.name;}),
      ids:g.members.map(function(m){return m.id;})};
  }else{
    S.sheet={kind:"group",id:null,name:"",currency:DEFAULT_CURRENCY,names:["You",""],ids:[null,null]};
  }
  S.confirm=null;render();
}
function saveExpense(){
  var F=S.sheet,g=S.groups[F.gid];
  if(!g)return;
  var cur=g.currency,total=parseMoney(F.amount,cur),i;
  var res=computeShares(total,F.mode,F.sel,F.raw,cur);
  if(res.err){toast(res.err);return;}
  var payers=[];
  if(F.multiPay){
    for(i=0;i<F.payerOrder.length;i++){
      var c=parseMoney(F.payRaw[F.payerOrder[i]],cur);
      if(!isNaN(c)&&c>0)payers.push({m:F.payerOrder[i],cents:c});
    }
    var sum=0;
    for(i=0;i<payers.length;i++)sum+=payers[i].cents;
    if(sum!==total){toast("The payments need to add up to "+fmt(total,cur)+".");return;}
  }else payers=[{m:F.payer,cents:total}];
  if(!payers.length){toast("Say who paid.");return;}
  var raw={};
  for(i=0;i<F.sel.length;i++)if(F.raw[F.sel[i]]!=null)raw[F.sel[i]]=F.raw[F.sel[i]];
  var id=F.id||uid(),prev=F.id?S.expenses[F.id]:null;
  var body={id:id,gid:g.id,desc:F.desc.trim(),cents:total,category:F.category,
    date:F.date,note:F.note.trim(),mode:F.mode,payers:payers,shares:res.shares,rawSplit:raw,
    createdAt:prev?prev.createdAt:Date.now()};
  if(prev&&prev.series)body.series=prev.series;
  /* The expense being saved is the first of the run, so the series counts from
     its date and makes nothing until the next one falls due. */
  var rule=(F.rule&&F.rule.unit&&!body.series&&isDate(F.date))?F.rule:null;
  if(rule){
    var sid=uid();
    body.series=sid;
    put("series",sid,{id:sid,gid:g.id,rule:rule,anchor:F.date,stopped:null,
      createdAt:Date.now(),
      tmpl:{desc:body.desc,cents:body.cents,category:body.category,note:body.note,
        mode:body.mode,payers:body.payers,shares:body.shares,rawSplit:body.rawSplit}});
  }
  put("expenses",id,body);
  S.sheet=null;S.confirm=null;render();
  /* A repeat dated back a few months owes the dates in between straight away,
     rather than when the app is next opened. */
  if(rule)runSeries();
  toast(rule?"Added “"+body.desc+"” — "+ruleText(rule,F.date).toLowerCase()+" from now on."
    :F.id?"Expense updated.":"Added “"+body.desc+"”.");
}
function saveGroup(){
  var F=S.sheet,i,members=[];
  for(i=0;i<F.names.length;i++){
    var nm=F.names[i].trim();
    if(!nm)continue;
    members.push({id:F.ids[i]||uid(),name:nm});
  }
  if(!members.length){toast("Add at least one person.");return;}
  var id=F.id||uid(),prev=S.groups[id];
  put("groups",id,{id:id,name:F.name.trim(),currency:F.currency,members:members,
    createdAt:prev?prev.createdAt:Date.now()});
  S.gid=id;lsSet("evenly.gid",id);
  if(!S.me[id]){S.me[id]=members[0].id;lsSet("evenly.me",S.me);}
  S.sheet=null;render();
  if(!prev)toast("Group created. Add your first expense next.");
}
function saveSettle(){
  var F=S.sheet,g=S.groups[F.gid];
  if(!g)return;
  var amt=parseMoney(F.amount,g.currency);
  if(isNaN(amt)||amt<=0){toast("Enter an amount.");return;}
  if(F.from===F.to){toast("Pick two different people.");return;}
  var id=uid();
  put("settlements",id,{id:id,gid:g.id,from:F.from,to:F.to,cents:amt,date:F.date,createdAt:Date.now()});
  S.sheet=null;render();
  toast(memName(g,F.from)+" → "+memName(g,F.to)+": "+fmt(amt,g.currency)+" recorded.");
}
function saveMembers(){
  var g=S.groups[S.sheet.gid];
  if(!g){S.sheet=null;render();return;}
  var inputs=document.querySelectorAll("#sheetroot [data-mname]"),i,members=[],changed=false;
  for(i=0;i<inputs.length;i++){
    var id=inputs[i].getAttribute("data-mname"),nm=inputs[i].value.trim(),old=memName(g,id);
    if(!nm)nm=old;
    if(nm!==old)changed=true;
    members.push({id:id,name:nm});
  }
  if(changed){
    var copy=JSON.parse(JSON.stringify(g));
    copy.members=members;
    put("groups",g.id,copy);
  }
  S.sheet=null;S.confirm=null;render();
}
function exportCSV(){
  var g=S.groups[S.sheet?S.sheet.gid:S.gid];
  if(!g)return;
  var ex=expensesOf(g.id),st=settlementsOf(g.id),d=cinfo(g.currency).d,i,j,k;
  var head=["Date","Description","Category","Currency","Amount","Paid by","Note"];
  for(i=0;i<g.members.length;i++)head.push("Share: "+g.members[i].name);
  var lines=[head.map(csvCell).join(",")];
  for(i=0;i<ex.length;i++){
    var e=ex[i];
    var paid=e.payers.map(function(p){return memName(g,p.m)+" "+(p.cents/100).toFixed(d);}).join(" + ");
    var row=[e.date,e.desc,cat(e.category).label,g.currency,(e.cents/100).toFixed(d),paid,e.note||""];
    for(j=0;j<g.members.length;j++){
      var sh=0;
      for(k=0;k<e.shares.length;k++)if(e.shares[k].m===g.members[j].id)sh=e.shares[k].cents;
      row.push(sh?(sh/100).toFixed(d):"");
    }
    lines.push(row.map(csvCell).join(","));
  }
  for(i=0;i<st.length;i++){
    var s=st[i];
    lines.push([s.date,"Payment: "+memName(g,s.from)+" to "+memName(g,s.to),"Settlement",
      g.currency,(s.cents/100).toFixed(d),memName(g,s.from),""].map(csvCell).join(","));
  }
  var name=(g.name.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"-").toLowerCase()||"group")+"-expenses.csv";
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  toast("CSV downloaded.");
}
function copyLink(){
  var el=document.getElementById("sharelink");
  if(!el)return;
  el.select();
  var done=function(){toast("Link copied. Anyone with it can open this ledger.");};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(el.value).then(done,function(){toast("Press Ctrl+C to copy the selected link.");});
  else toast("Press Ctrl+C to copy the selected link.");
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");
  if(!t)return;
  var a=t.getAttribute("data-act");
  if(a!=="delexp"&&a!=="delgroup"&&a!=="rmmember"&&a!=="leavespace")S.confirm=null;

  if(a==="scrim"){
    /* the identity question needs an answer, so it ignores a stray tap outside */
    if(ev.target===t&&S.sheet&&S.sheet.kind!=="whoami"){S.sheet=null;S.confirm=null;render();}
    return;
  }
  if(a==="setwho"){
    var who=t.getAttribute("data-id"),wg=S.groups[S.sheet.gid];
    S.me[S.sheet.gid]=who;lsSet("evenly.me",S.me);
    S.sheet=null;render();
    toast("Set. Figures on this device are now shown from "+memName(wg,who)+"’s side.");
    return;
  }
  if(a==="close"){S.sheet=null;S.confirm=null;render();return;}
  if(a==="pick"){S.gid=t.getAttribute("data-id");lsSet("evenly.gid",S.gid);S.tab="expenses";S.shown=200;render();return;}
  if(a==="tab"){S.tab=t.getAttribute("data-tab");render();return;}
  if(a==="showmore"){S.shown+=300;render();return;}
  if(a==="pickmonth"){S.month=t.getAttribute("data-m");render();return;}
  if(a==="pickyear"){S.year=t.getAttribute("data-y");render();return;}
  if(a==="span"){S.span=t.getAttribute("data-v");render();return;}
  if(a==="classify"){S.showCats=12;S.catQuery="";S.sheet={kind:"classify",gid:S.gid};render();return;}
  if(a==="morecats"){S.showCats+=12;render();return;}
  if(a==="exportun"){exportUnclassified();return;}
  if(a==="bulkrules"){
    var ta=document.getElementById("bulkrules");
    if(!ta||!ta.value.trim()){toast("Paste some lines first.");return;}
    applyBulkRules(S.sheet.gid,ta.value);
    return;
  }
  if(a==="addcat"){
    var nmEl=document.getElementById("newcat"),bkEl=document.getElementById("newcatbucket");
    if(!nmEl||!nmEl.value.trim()){toast("Give the category a name first.");return;}
    var nmVal=nmEl.value.trim();
    addCat(S.sheet.gid,nmVal,bkEl?bkEl.value:"wants");
    toast("Added “"+nmVal+"”. It is now one of the choices below.");
    return;
  }
  if(a==="import"){S.sheet={kind:"import",gid:S.gid,parsed:null,map:[],error:null,busy:false};render();return;}
  if(a==="runimport"){applyImport();return;}
  if(a==="newgroup"){openGroup(null);return;}
  if(a==="editgroup"){openGroup(S.gid);return;}
  if(a==="gmenu"){S.sheet={kind:"gmenu",gid:S.gid};render();return;}
  if(a==="members"){S.sheet={kind:"members",gid:S.gid};render();return;}
  if(a==="share"){S.sheet={kind:"share"};render();return;}
  if(a==="addexp"){openExpense(null);return;}
  if(a==="openexp"){openExpense(t.getAttribute("data-id"));return;}
  if(a==="saveexp"){saveExpense();return;}
  if(a==="savegroup"){saveGroup();return;}
  if(a==="savesettle"){saveSettle();return;}
  if(a==="savemembers"){saveMembers();return;}
  if(a==="export"){exportCSV();return;}
  if(a==="copylink"){copyLink();return;}
  if(a==="createspace"){createSpace();return;}
  if(a==="syncnow"){sync();return;}
  if(a==="leavespace"){
    if(S.confirm!=="leave"){S.confirm="leave";render();return;}
    S.confirm=null;S.sheet=null;leaveSpace();return;
  }
  if(a==="settle"){
    var g=S.groups[S.gid];
    if(!g)return;
    var me=meOf(g.id),from=t.getAttribute("data-from"),to=t.getAttribute("data-to"),amt=t.getAttribute("data-amt");
    var other=null,i;
    for(i=0;i<g.members.length;i++)if(g.members[i].id!==me){other=g.members[i].id;break;}
    S.sheet={kind:"settle",gid:g.id,from:from||me,to:to||other||me,
      amount:amt?(parseInt(amt,10)/100).toFixed(cinfo(g.currency).d):"",date:today()};
    render();return;
  }
  if(a==="fmode"){S.sheet.mode=t.getAttribute("data-v");render();return;}
  if(a==="fcat"){S.sheet.category=t.getAttribute("data-v");render();return;}
  if(a==="fpayer"){S.sheet.payer=t.getAttribute("data-v");render();return;}
  if(a==="fsel"){
    var who2=t.getAttribute("data-v"),at2=S.sheet.sel.indexOf(who2);
    if(at2<0)S.sheet.sel.push(who2);else S.sheet.sel.splice(at2,1);
    render();return;
  }
  if(a==="multipay"){
    var on=t.getAttribute("data-v")==="1";
    S.sheet.multiPay=on;
    if(on){
      var gg=S.groups[S.sheet.gid],tot=parseMoney(S.sheet.amount,gg.currency);
      S.sheet.payerOrder=gg.members.map(function(m){return m.id;});
      S.sheet.payRaw={};
      if(S.sheet.payer&&!isNaN(tot))
        S.sheet.payRaw[S.sheet.payer]=(tot/100).toFixed(cinfo(gg.currency).d);
    }
    render();return;
  }
  if(a==="addname"){S.sheet.names.push("");S.sheet.ids.push(null);render();return;}
  if(a==="rmname"){
    var ix=parseInt(t.getAttribute("data-i"),10);
    S.sheet.names.splice(ix,1);S.sheet.ids.splice(ix,1);render();return;
  }
  if(a==="addmember"){
    var g2=S.groups[S.sheet.gid];
    if(!g2)return;
    var c2=JSON.parse(JSON.stringify(g2));
    c2.members.push({id:uid(),name:"New person"});
    put("groups",g2.id,c2);return;
  }
  if(a==="rmmember"){
    var mid=t.getAttribute("data-id");
    if(S.confirm!=="mem:"+mid){S.confirm="mem:"+mid;render();return;}
    var g3=S.groups[S.sheet.gid];
    if(!g3)return;
    var c3=JSON.parse(JSON.stringify(g3));
    c3.members=c3.members.filter(function(m){return m.id!==mid;});
    S.confirm=null;
    if(!c3.members.length){toast("A group needs at least one person.");render();return;}
    put("groups",g3.id,c3);return;
  }
  /* One tap, undone from the toast. Asking for a second tap meant tapping a
     button whose label had just grown, so it had moved out from under the
     thumb -- and the thing underneath it was Cancel. */
  if(a==="delexp"){
    var eid=t.getAttribute("data-id"),gone=S.expenses[eid];
    if(!gone)return;
    var copy=JSON.parse(JSON.stringify(gone));
    S.sheet=null;S.confirm=null;
    drop("expenses",eid);
    toast("Deleted “"+copy.desc+"”.","Undo",function(){
      put("expenses",copy.id,copy);
      toast("Put back.");
    });
    return;
  }
  if(a==="toastact"){
    var act=toastAct;toastAct=null;
    document.getElementById("toastroot").innerHTML="";
    if(act)act();
    return;
  }
  if(a==="repeatopen"){S.sheet.step="repeat";render();return;}
  if(a==="repeatback"){S.sheet.step=S.sheet.step==="custom"?"repeat":null;render();return;}
  if(a==="repeatpick"){
    var pick=t.getAttribute("data-v"),opts=repeatChoices(S.sheet.date),oi;
    for(oi=0;oi<opts.length;oi++)if(opts[oi].id===pick)S.sheet.rule=opts[oi].rule;
    S.sheet.step=null;render();return;
  }
  if(a==="repeatcustom"){
    var r0=S.sheet.rule;
    S.sheet.cust={unit:r0&&r0.unit?r0.unit:"month",n:r0&&r0.n>0?r0.n:1,by:!!(r0&&r0.by)};
    S.sheet.step="custom";render();return;
  }
  if(a==="runit"){S.sheet.cust.unit=t.getAttribute("data-v");render();return;}
  if(a==="rby"){S.sheet.cust.by=t.getAttribute("data-v")==="dow";render();return;}
  if(a==="repeatsave"){
    S.sheet.rule=custRule(S.sheet.cust,S.sheet.date);
    S.sheet.step=null;render();return;
  }
  if(a==="series"){S.sheet={kind:"series",gid:S.gid};render();return;}
  if(a==="stopseries"){
    var ssid=t.getAttribute("data-id"),ser=S.series[ssid];
    if(!ser)return;
    var scopy=JSON.parse(JSON.stringify(ser));
    scopy.stopped=today();scopy.updatedAt=Date.now();
    put("series",ssid,scopy);
    toast("Stopped. Nothing further goes in.");
    return;
  }
  if(a==="rmseries"){
    drop("series",t.getAttribute("data-id"));
    toast("Taken off the list. The expenses it added are still there.");
    return;
  }
  if(a==="delgroup"){
    var gid=t.getAttribute("data-id");
    if(S.confirm!=="grp:"+gid){S.confirm="grp:"+gid;render();return;}
    S.confirm=null;S.sheet=null;
    var ex=expensesOf(gid),st=settlementsOf(gid),z;
    for(z=0;z<ex.length;z++)drop("expenses",ex[z].id);
    for(z=0;z<st.length;z++)drop("settlements",st[z].id);
    drop("groups",gid);
    S.gid=null;render();toast("Group deleted.");return;
  }
});

var catT=null;                       /* debounce for the classifier search box */
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="mesel")return;
  if(!S.sheet)return;
  if(el.id==="catsearch"){
    S.catQuery=el.value;
    S.showCats=12;
    if(catT)clearTimeout(catT);
    var caret=el.selectionStart;
    catT=setTimeout(function(){
      catT=null;renderSheet();
      var again=document.getElementById("catsearch");
      if(again){again.focus();try{again.setSelectionRange(caret,caret);}catch(e){}}
    },220);
    return;
  }
  var f=el.getAttribute("data-f");
  if(f){
    S.sheet[f]=el.value;
    if(f==="desc"||f==="note")revalidate();else softRender(el);
    return;
  }
  var sp=el.getAttribute("data-split");
  if(sp){S.sheet.raw[sp]=el.value;softRender(el);return;}
  var pay=el.getAttribute("data-pay");
  if(pay){S.sheet.payRaw[pay]=el.value;softRender(el);return;}
  var rn=el.getAttribute("data-rn");
  if(rn!==null&&S.sheet.cust){S.sheet.cust.n=el.value;softRender(el);return;}
  var nm=el.getAttribute("data-name");
  if(nm!==null){S.sheet.names[parseInt(nm,10)]=el.value;revalidate();return;}
});
document.addEventListener("change",function(ev){

  if(!S.sheet)return;

  var cn=el.getAttribute("data-catname");
  if(cn!==null){renameCat(S.sheet.gid,cn,el.value);return;}
  var rl=el.getAttribute("data-rule");
  /* An empty choice clears the rule, so a category can be taken back off. */
  if(rl!==null){setRule(S.sheet.gid,rl,el.value);return;}
  var sel=el.getAttribute("data-sel");
  if(sel){
    var i=S.sheet.sel.indexOf(sel);
    if(el.checked&&i<0)S.sheet.sel.push(sel);
    else if(!el.checked&&i>=0)S.sheet.sel.splice(i,1);
    render();return;
  }
  var f=el.getAttribute("data-f");
  if(f&&el.tagName==="SELECT"){S.sheet[f]=el.value;render();}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&S.sheet&&S.sheet.kind!=="whoami"){S.sheet=null;S.confirm=null;render();}
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&S.space)sync();
});
window.addEventListener("online",function(){if(S.space)sync();});

/* Enable or disable a sheet's save button without rebuilding the sheet. */
function revalidate(){
  if(!S.sheet)return;
  var F=S.sheet,btn;
  if(F.kind==="expense"){
    btn=document.querySelector('#sheetroot [data-act="saveexp"]');
    if(!btn)return;
    var g=S.groups[F.gid];
    if(!g)return;
    var cur=g.currency,total=parseMoney(F.amount,cur);
    if(isNaN(total))total=0;
    var res=computeShares(total,F.mode,F.sel,F.raw,cur),payTotal=0,i;
    if(F.multiPay)for(i=0;i<F.payerOrder.length;i++){
      var pc=parseMoney(F.payRaw[F.payerOrder[i]],cur);
      if(!isNaN(pc))payTotal+=pc;
    }
    btn.disabled=!!res.err||!F.desc.trim()||(F.multiPay&&payTotal!==total);
  }else if(F.kind==="group"){
    btn=document.querySelector('#sheetroot [data-act="savegroup"]');
    if(!btn)return;
    btn.disabled=!F.name.trim()||F.names.filter(function(s){return s.trim();}).length<1;
  }
}
/* Rebuild the sheet after typing settles, restoring focus and caret. */
var softT=null;
function softRender(el){
  if(softT)clearTimeout(softT);
  var kf=el.getAttribute("data-f"),ks=el.getAttribute("data-split"),kp=el.getAttribute("data-pay"),
      kr=el.getAttribute("data-rn");
  var sel=kf?'[data-f="'+kf+'"]':ks?'[data-split="'+ks+'"]':kp?'[data-pay="'+kp+'"]'
    :kr?'[data-rn="'+kr+'"]':null;
  var pos=null;
  try{pos=el.selectionStart;}catch(e){}
  softT=setTimeout(function(){
    renderSheet();
    if(!sel)return;
    var again=document.querySelector("#sheetroot "+sel);
    if(again){
      again.focus();
      if(pos!=null){try{again.setSelectionRange(pos,pos);}catch(e){}}
    }
  },250);
}

/* ========================================================================
   Boot
   ====================================================================== */
S.me=ls("evenly.me",{});
S.gid=ls("evenly.gid",null);
S.space=ls("evenly.space",null);

var invite=readShareHash();
if(invite&&(!S.space||invite.id!==S.space.id||invite.key!==S.space.key)){
  /* No persist() here: nothing has been loaded yet, so writing now would put
     an empty ledger over the cache of the space being left. */
  S.space=invite;
  lsSet("evenly.space",invite);
  S.gid=null;
}
keepShareHash();

loadData().then(function(){
  S.ready=true;
  setStatus(S.space?"busy":"local");
  render();
  maybeAskWhoAmI();
  if(!S.space){runSeries();return;}
  if(!(self.crypto&&self.crypto.subtle)){
    setStatus("off");
    toast("Shared spaces need a secure connection. Open this app over https.");
    return;
  }
  return deriveKeys(S.space.key)
    .then(function(k){KEYS=k;return sync();})
    .then(startPolling)
    .catch(function(){
      setStatus("off");
      toast("Could not unlock this shared space on this device.");
    });
});
})();
</script>
